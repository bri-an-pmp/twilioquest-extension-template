name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege: read-only by default; only the release job can write.
permissions:
  contents: read

jobs:
  build:
    name: 📦 Build Extension
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: npm ci --omit=dev
      - name: Create extension zip (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: zip -r ${{ github.event.repository.name }}-macos.zip . -x '.git/*' '.github/*'
      - name: Create extension zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: zip -r ${{ github.event.repository.name }}-linux.zip . -x '.git/*' '.github/*'
      - name: Create extension zip (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -Force -Exclude .git,.github | Compress-Archive -DestinationPath ${{ github.event.repository.name }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ runner.os }}
          path: ${{ github.event.repository.name }}-*.zip

  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
